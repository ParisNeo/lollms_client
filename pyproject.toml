[build-system]
requires = ["setuptools>=80.9", "wheel"]
build-backend = "setuptools.build_meta"
# REMOVE THE LINE BELOW:
# backend-path = ["."]

[project]
name = "lollms_client"
dynamic = ["version"]
authors = [
    {name = "ParisNeo", email = "parisneoai@gmail.com"},
]
description = "A client library for LoLLMs generate endpoint"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "httpx",
    "requests",
    "ascii-colors>=0.13.0",
    "pipmaster>=1.2.0",
    "pyyaml",
    "tiktoken",
    "pydantic",
    "numpy",
    "pillow",
    "sqlalchemy",
    "jsonschema",
    "filelock",
    "pymupdf4llm==1.28.0",
]

[project.optional-dependencies]
gui = [
    "nicegui>=1.4",
    "pywebview>=4.4",
    "pygments>=2.15.0"
]
bot = [
    "python-telegram-bot>=20.0",
    "discord.py>=2.0",
    "slack-bolt>=1.18.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0"
]

[project.urls]
Homepage = "https://github.com/ParisNeo/lollms_client"

# Exclude script launcher from the core library package
[project.scripts]
lollms-bot = "lollms_client.apps.lollms_bot.cli:main"
lollms-code = "lollms_client.apps.lollms_code.cli:main"
lollms-config = "lollms_client.apps.lollms_config.cli:main"
lollms-config-wizard = "lollms_client.lollms_config_cli_env:run_wizard_and_save"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["lollms_client.egg-info*", "lollms_client.llm_bindings.llama_cpp_server.bin"]

[tool.setuptools.dynamic]
version = {attr = "lollms_client.__version__"}
[tool.setuptools.package-data]
lollms_client = ["assets/*.json", "**/description.yaml", "apps/lollms_discussions/static/*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*pyparsing.*:DeprecationWarning",
    "ignore:.*Pyparsing.*:UserWarning",
    "ignore:Matplotlib is currently using agg.*:UserWarning"
]
