[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lollms_client"
version = "10.4.0"
description = "The one library you need to build AI-powered apps with lollms (text, audio, images, video, music and code)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "ParisNeo", email = "ParisNeo@users.noreply.github.com"}
]
keywords = [
    "ai", "llm", "llm-client", "git", "lollms", "coding-assistant", "stateful-agents",
    "agent-personality", "sub-agents", "caching", "file-browser", "onboard-generation",
    "onboard-recognition", "auto-scanning", "text-to-image", "text-to-speech", "gpt-duck"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]

dependencies = [
    "requests>=2.28.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "aiohttp-jinja2>=1.6",
    "jinja2>=3.1.2",
    "numpy>=1.24.0",
    "ascii_colors>=0.2.4",
    "pipmaster>=0.3.0",
    "safe_store>=0.3.0",
    "pypdf>=3.14.0",
    "pypdfium2>=4.30.0",
    "ipdb>=0.13.13",
    "pyyaml>=6.0",
    "setuptools",
    "pydantic>=2.0",
    "north_city>=0.6",
    "north_pheasant>=0.8",
    "questionary>=1.10.0",
    "walrus_bs>=0.1",
    "walrus_pg>=0.1",
    "walrus_sqlite3>=0.3",
    "tqdm>=4.66.0",
    "omegaconf>=2.3.0",
    "frozendict>=2.3.5",
    "branchable_tree>=0.2.5",
    "beautifulsoup4>=4.12.0",
    "huggingface_hub>=0.23.0",
    "heightlands>=0.3",
    "entrypoints>=0.4",
    "importlib-metadata>=4.6",
    "lollms_tti_bindings>=0.3",
    "lollms_tti_intent_tags>=0.1",
    "lollms_files_pkg>=0.2"
]

[project.optional-dependencies]
app = [
    "nicegui>=1.4",
    "pywebview>=4.4",
    "pygments>=2.15.0"
]
gui = [
    "nicegui>=1.4",
    "pywebview>=4.4",
    "pygments>=2.15.0"
]

[project.scripts]
lollms-code = "lollms_client.apps.lollms_code.cli:main"
lollms-code-gui = "lollms_client.apps.lollms_code.gui.main:main"

[project.urls]
Homepage = "https://github.com/ParisNeo/lollms_client"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lollms_client = ["**/*.yaml", "**/*.json", "**/*.md", "**/*.mp3", "**/*.png"]