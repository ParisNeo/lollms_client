[build-system]
requires = ["setuptools>=80.9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lollms_client"
dynamic = ["version"]
authors = [
    {name = "ParisNeo", email = "parisneoai@gmail.com"},
]
sescription = "A client library for LoLLMs generate endpoint"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
keywords = [
    "ai", "llm", "llm-client", "git", "lollms", "coding-assistant", "stateful-agents",
    "agent-personality", "sub-agents", "caching", "file-browser", "onboard-generation",
    "onboard-recognition", "auto-scanning", "text-to-image", "text-to-speech", "gpt-duck"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]

dependencies = [
    "httpx",
    "requests",
    "ascii-colors>=0.11.26",
    "pipmaster>=1.1.13",
    "pyyaml",
    "tiktoken",
    "pydantic",
    "numpy",
    "pillow",
    "sqlalchemy",
    "jsonschema",
    "pymupdf4llm==1.28.0"
]

[project.optional-dependencies]
gui = [
    "nicegui>=1.4",
    "pywebview>=4.4",
    "pygments>=2.15.0"
]
[project.urls]
Homepage = "https://github.com/ParisNeo/lollms_client"


[project.scripts]
lollms-code = "lollms_client.apps.lollms_code.cli:main"
lollms-code-gui = "lollms_client.apps.lollms_code.gui.main:main"


[tool.setuptools.packages.find]
where = ["src"]
exclude = ["lollms_client.egg-info*", "lollms_client.llm_bindings.llama_cpp_server.bin"]

[tool.setuptools.dynamic]
version = {attr = "lollms_client.__version__"}

[tool.setuptools.package-data]
lollms_client = ["assets/*.json", "**/description.yaml", "apps/lollms_discussions/static/*", "apps/lollms_code/*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*pyparsing.*:DeprecationWarning",
    "ignore:.*Pyparsing.*:UserWarning",
    "ignore:Matplotlib is currently using agg.*:UserWarning"
]