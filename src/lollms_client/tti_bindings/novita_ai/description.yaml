title: 'Novita.ai TTI'
author: 'ParisNeo & Lollms'
version: 2.0.0
binding_name: 'novita_ai'
description: >
  A binding for Novita.ai asynchronous image generation and editing API (V3).
  Provides fast access to popular open-source diffusion models like SDXL, Juggernaut XL,
  and Realistic Vision via txt2img and img2img task polling.

global_input_parameters:
  - name: "api_key"
    type: "str"
    default: ""
    description: "Your Novita.ai API key. Can also be set via the NOVITA_API_KEY environment variable."
    is_secret: true
  - name: "service_key"
    type: "str"
    default: ""
    description: "Alias for api_key."
    is_secret: true

model_input_parameters:
  - name: "model_name"
    type: "str"
    default: "sd_xl_base_1.0.safetensors"
    description: "The model checkpoint name to use on Novita.ai."
    options:
      - "sd_xl_base_1.0.safetensors"
      - "juggernaut_xl_v9_rundiffusion.safetensors"
      - "dreamshaper_xl_1_0.safetensors"
      - "realistic_vision_v5.1.safetensors"
      - "absolutereality_v1.8.1.safetensors"
      - "meinamix_meina_v11.safetensors"

generate_image_parameters:
  - name: "prompt"
    type: "str"
    description: "The text prompt describing the image."
  - name: "negative_prompt"
    type: "str"
    description: "Optional negative prompt to avoid unwanted features."
  - name: "width"
    type: "int"
    default: 1024
    description: "Image width in pixels."
  - name: "height"
    type: "int"
    default: 1024
    description: "Image height in pixels."
  - name: "num_inference_steps"
    type: "int"
    default: 25
    description: "Number of denoising steps."
  - name: "guidance_scale"
    type: "float"
    default: 7.0
    description: "Prompt adherence strength (CFG scale)."
  - name: "seed"
    type: "int"
    default: -1
    description: "Seed for reproducibility (-1 for random)."

commands:
  - name: get_user_balance
    title: Get User Balance
    description: "Queries the user account balance from Novita AI."
  - name: validate_key
    title: Validate API Key
    description: "Tests the API key against Novita AI models endpoint."