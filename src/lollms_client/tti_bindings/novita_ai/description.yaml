title: 'Novita.ai TTI'
author: 'ParisNeo & Lollms'
version: 3.2.1
binding_name: 'novita_ai'
description: >
  A binding for the Novita.ai image generation and editing APIs.
  The qwen-image model bundles text-to-image generation and image
  editing in a single entry: calls without input images are routed to
  the asynchronous v3 txt2img task and calls with input images are
  routed to the Qwen-Image Edit task. Ming-Image requests are routed
  to the OpenAI-compatible image protocol (probing the documented /v1
  paths and the /v3/openai paths). Novita retired the legacy
  checkpoint-based txt2img/img2img routes, so generic Stable Diffusion
  checkpoint names are rejected with an explicit migration error
  listing the supported foundation models.

global_input_parameters:
  - name: "api_key"
    type: "str"
    default: ""
    description: "Your Novita.ai API key. Can also be set via the NOVITA_API_KEY environment variable."
    is_secret: true
  - name: "service_key"
    type: "str"
    default: ""
    description: "Alias for api_key."
    is_secret: true

model_input_parameters:
  - name: "model_name"
    type: "str"
    default: "qwen-image"
    description: "The Novita.ai foundation model to use. 'qwen-image' bundles generation and editing: the appropriate API is picked automatically based on whether input images are provided. Legacy Stable Diffusion checkpoints are no longer served by the Novita API."
    options:
      - "qwen-image"
      - "ming-image-0.1-design"
      - "ming-image-0.1-design-layer"

generate_image_parameters:
  - name: "prompt"
    type: "str"
    description: "The text prompt describing the image."
  - name: "width"
    type: "int"
    default: 1024
    description: "Image width in pixels. Clamped to the model's supported range (Qwen-Image: 256-1536, Ming-Image: 1024 minimum)."
  - name: "height"
    type: "int"
    default: 1024
    description: "Image height in pixels. Clamped to the model's supported range (Qwen-Image: 256-1536, Ming-Image: 1024 minimum)."
  - name: "size"
    type: "str"
    description: "Explicit output size for Ming-Image requests, e.g. '1024x1024'. Overrides width/height when provided."
  - name: "seed"
    type: "int"
    default: -1
    description: "Seed for reproducibility (-1 for random). Qwen-Image edits only."
  - name: "output_format"
    type: "str"
    default: "png"
    description: "Output image format. Qwen-Image accepts jpeg/png/webp, Ming-Image accepts png/jpeg."
  - name: "watermark"
    type: "bool"
    default: false
    description: "Applies the official Novita watermark to Ming-Image results."
  - name: "timeout"
    type: "int"
    default: 180
    description: "Maximum seconds to wait for asynchronous task completion (Qwen-Image defaults to 300)."

commands:
  - name: get_user_balance
    title: Get User Balance
    description: "Queries the user account balance from Novita AI."
  - name: validate_key
    title: Validate API Key
    description: "Tests the API key against the authenticated Novita AI model endpoint."