title: Ollama
author: ParisNeo
creation_date: 2025-08-13
last_update_date: 2025-08-13
description: Connects to a local or remote Ollama server, allowing for easy use of a wide variety of models like Llama3, Phi3, etc.
global_input_parameters:
  - name: host_address
    type: str
    description: "The URL of the Ollama server. Defaults to 'http://localhost:11434'."
    mandatory: true
    default: "http://localhost:11434"
  - name: service_key
    type: str
    description: "An optional API key or bearer token if the Ollama server requires authentication."
    mandatory: false
    default: ""
  - name: verify_ssl_certificate
    type: bool
    description: "Whether to verify the SSL certificate of the Ollama server. Defaults to true."
    mandatory: false
    default: true
  - name: n_threads
    type: int
    description: "Number of threads."
    mandatory: false
    default: -1

model_input_parameters:
  - name: model_name
    type: str
    description: "The name of the model to use from the Ollama server (e.g., 'llama3:8b')."
    mandatory: true
    default: "llama3:latest"
commands:
  - name: pull_model
    title: Pull Model
    description: "Pulls a model from the Ollama library."
    parameters:
      - name: model_name
        type: str
        description: "The name of the model to pull."
        mandatory: true
    output:
      - name: status
        type: bool
        description: "Status of the operation (true for success, false for failure)"
      - name: message
        type: str
        description: "Message describing the operation result"
    callback:
      - name: status
        type: str
        description: "Current status of the download"
      - name: completed
        type: int
        description: "Bytes downloaded so far"
      - name: total
        type: int
        description: "Total bytes to download"
  - name: install_ollama
    title: Install Ollama
    description: "Installs the Ollama server software on the host system (Linux, Windows, macOS)."
    parameters: []
    output:
      - name: status
        type: bool
        description: "Status of the operation"
      - name: message
        type: str
        description: "Result message"
    callback:
      - name: status
        type: str
        description: "Current status"
      - name: completed
        type: int
        description: "Percentage completed"
      - name: total
        type: int
        description: "Total percentage (100)"
  - name: get_user_balance
    title: Get User Balance
    description: "Queries the account balance from the Ollama Cloud subscription service (GET https://ollama.com/api/balance). Only available when host_address points to ollama.com and a service_key is configured; local Ollama servers return a not-applicable status. Results are cached briefly to respect the endpoint's shared 10 requests/minute rate limit. Balances are shared across all team members."
    parameters: []
    output:
      - name: status
        type: bool
        description: "True if the balance was successfully fetched"
      - name: balance
        type: float
        description: "The available balance (included + purchased), when parseable"
      - name: included
        type: float
        description: "The included subscription balance shared across team members, when exposed"
      - name: purchased
        type: float
        description: "The purchased balance shared across team members, when exposed"
      - name: data
        type: dict
        description: "The raw JSON payload returned by Ollama Cloud"
      - name: message
        type: str
        description: "Error or status message on failure"
      - name: retry_after
        type: int
        description: "Seconds to wait when rate limited (HTTP 429)"
