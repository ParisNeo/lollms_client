title: LlamaCpp Server (Enhanced)
author: ParisNeo
creation_date: 2025-12-13
last_update_date: 2026-10-16
description: |
  Runs a fully-local llama.cpp server that exposes an OpenAI-compatible API.
  Loads GGUF models from a local folder and manages server processes automatically.

  **Process & Thread Safety:**
  A file-lock (filelock) serialises all server-spawn decisions across every
  process and thread sharing the same models directory.  Each running server is
  tracked via a lightweight JSON registry under `<models_path>/servers/`.

  **Multi-Model Capacity:**
  `max_active_models` controls how many llama-servers may run simultaneously.
  When the limit is reached the Least-Recently-Used model is evicted
  automatically.  Setting it to -1 removes the cap entirely.

  **Idle Timeout:**
  When `idle_timeout` is set to a
  positive number (seconds), a background
  watchdog thread will automatically shut down servers that have not received
  a request within that window.

  **Multimodal / Vision:**
  mmproj files are auto-detected by naming convention, or registered explicitly
  with `bind_multimodal_model()`.  Images can be passed as local file paths or
  HTTP URLs; they are encoded as base64 data-URIs transparently.

  **Split-GGUF Support:**
  Multi-part models (e.g., `model-00001-of-00003.gguf`) are handled in both
  `list_models()` and `pull_model()`.

  **Advanced Server Flags:**
  Exposes flash-attn, mmap/mlock, rope scaling, tensor-split, cache-type-k/v,
  and per-GPU settings through constructor kwargs.

global_input_parameters:
  - name: host
    type: str
    description: "Interface to bind the server to."
    mandatory: false
    default: "localhost"
  - name: port
    type: int
    description: "Dedicated port number for this server instance (null/0 for auto-assign)."
    mandatory: false
    default: null
  - name: max_active_models
    type: int
    description: "Maximum simultaneous model servers (-1 = unlimited)."
    mandatory: false
    default: 1
  - name: idle_timeout
    type: float
    description: "Seconds of inactivity before a server is auto-stopped (-1 = disabled)."
    mandatory: false
    default: -1
  - name: server_log_depth
    type: int
    informational: true
    description: "The maximum number of lines of server logs to return when querying get_server_logs."
    mandatory: false
    default: 500
  - name: models_path
    type: str
    description: "Directory containing GGUF model files."
    mandatory: false
    default: "data/models/llama_cpp_models"
  - name: binaries_path
    type: str
    description: "Directory containing llama.cpp server binaries."
    mandatory: false
    default: "data/bin/llama_cpp_bin"

model_input_parameters:
  - name: model_name
    type: str
    description: "Filename of the GGUF model to load on startup."
    mandatory: false
    default: ""

# ─────────────────────────────────────────────────────────────────────────────
# Per-model (per-profile) parameters.
#
# These knobs drive llama-server launch flags and legitimately differ from one
# model to another (a 7B Q4 fits fully on GPU with -1 layers, a 70B needs
# tensor_split; a 128k-context model needs a big ctx_size while a 4k model
# would waste VRAM). They are therefore declared at the *profile* level so the
# wizard, auto-generation, and headless API can populate them per model —
# not once per binding instance.
#
# The client forwards each profile's non-framework keys into `binding_config`,
# which the binding already consumes verbatim from `kwargs`. Nothing else is
# required to plumb them.
# ─────────────────────────────────────────────────────────────────────────────
model_profiles_input_parameters:
  - name: ctx_size
    type: int
    description: "Per-model context window size (tokens). Larger contexts consume more VRAM."
    mandatory: false
    default: 4096
  - name: n_gpu_layers
    type: int
    description: "Transformer layers offloaded to GPU for this model (-1 = all, 0 = CPU only)."
    mandatory: false
    default: -1
  - name: n_threads
    type: int
    description: "CPU threads used for generation with this model (null = auto)."
    mandatory: false
    default: null
  - name: n_parallel
    type: int
    description: "Parallel decoding slots for this model's server."
    mandatory: false
    default: 1
  - name: batch_size
    type: int
    description: "Prompt-evaluation batch size for this model."
    mandatory: false
    default: 512
  - name: flash_attn
    type: bool
    description: "Enable FlashAttention for this model (requires a compatible build and model)."
    mandatory: false
    default: false
  - name: mmap
    type: bool
    description: "Use memory-mapped I/O for this model's weights."
    mandatory: false
    default: true
  - name: mlock
    type: bool
    description: "Lock this model's weights in RAM (prevents swapping; not compatible with mmap)."
    mandatory: false
    default: false
  - name: rope_scale
    type: float
    description: "RoPE context scaling factor for this model (null = off)."
    mandatory: false
    default: null
  - name: rope_freq_base
    type: float
    description: "RoPE frequency base override for this model (null = model default)."
    mandatory: false
    default: null
  - name: rope_freq_scale
    type: float
    description: "RoPE frequency scale override for this model (null = model default)."
    mandatory: false
    default: null
  - name: tensor_split
    type: str
    description: "Comma-separated GPU tensor-split ratios for this model, e.g. '0.6,0.4'."
    mandatory: false
    default: null
  - name: main_gpu
    type: int
    description: "GPU index used for scratch/small tensors when this model runs."
    mandatory: false
    default: null
  - name: cache_type_k
    type: str
    description: "KV-cache key quantisation type for this model (f16, q8_0, q4_0 …)."
    mandatory: false
    default: null
  - name: cache_type_v
    type: str
    description: "KV-cache value quantisation type for this model."
    mandatory: false
    default: null
  - name: multimodal
    type: bool
    description: "Enable automatic vision projector (mmproj) detection for this model. Disable for text-only models to skip mmproj probing."
    mandatory: false
    default: true
  - name: reasoning
    type: str
    description: "Activates the reasoning mode for this model at the server level."
    mandatory: false
    default: "off"
    options:
      - "off"
      - "on"
  - name: reasoning_budget
    type: int
    description: "Maximum reasoning budget in tokens for this model (0 = unlimited)."
    mandatory: false
    default: 0

commands:
  - name: pull_model
    title: Pull Model from Hugging Face
    description: "Downloads a GGUF model (and optional mmproj) from Hugging Face Hub."
    parameters:
      - name: repo_id
        type: str
        description: "Hugging Face repository ID."
        mandatory: true
      - name: filename
        type: str
        description: "GGUF filename (first shard for split models)."
        mandatory: true
      - name: mmproj_repo_id
        type: str
        description: "Repo ID for the vision projector (optional). Defaults to `repo_id` when left blank — most GGUF repos ship the mmproj alongside the model file."
        mandatory: false
      - name: mmproj_filename
        type: str
        description: "Projector filename to download and bind (optional)."
        mandatory: false
    output:
      - name: status
        type: bool
      - name: message
        type: str
    callback:
      - name: status
        type: str
      - name: completed
        type: int
      - name: total
        type: int
    # ────────────────────────────────────────────────────────────────────────
    # Templates: curated, ready-to-run parameter combinations for popular
    # GGUF models. The wizard surfaces these as one-click choices so users
    # don't have to look up Hugging Face repo IDs and filenames manually.
    # Each template pre-fills every declared parameter above; the user can
    # still pick "✍️ Use custom parameters" to enter values themselves.
    # ────────────────────────────────────────────────────────────────────────
    templates:
      - name: Magistral Small 2509 (Mistral thinking model)
        description: Efficient thinking model from Mistral AI.
        size: "14.3 GB (Q4_K_M)"
        parameters:
          repo_id: bartowski/mistralai_Magistral-Small-2509-GGUF
          filename: mistralai_Magistral-Small-2509-Q4_K_M.gguf
      - name: Ministral 3 3B Instruct 2512 (small edge model)
        description: Lightweight Mistral edge model, fast on CPU.
        size: "2.2 GB (Q4_K_M)"
        parameters:
          repo_id: bartowski/mistralai_Ministral-3-3B-Instruct-2512-GGUF
          filename: mistralai_Ministral-3-3B-Instruct-2512-Q4_K_M.gguf
      - name: Devstral Small 2 24B (coding specialist)
        description: Devstral coding model from Mistral AI.
        size: "14.8 GB (Q4_K_M)"
        parameters:
          repo_id: bartowski/mistralai_Devstral-Small-2-24B-Instruct-2512-GGUF
          filename: mistralai_Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
      - name: Qwen3.5 4B GLB 3D Coder — Multimodal (vision enabled)
        description: Same 4B coder model + mmproj projector for multimodal inference.
        parameters:
          repo_id: ccore/Qwen3.5-4B-GLB-3D-Coder
          filename: Qwen3.5-4B-GLB-3D-Coder-Q4_K_M.gguf
          mmproj_filename: mmproj-Qwen3.5-4B-BF16.gguf
      - name: Llama 4 Scout 17B (16-expert MoE)
        description: Meta Llama 4 Scout Mixture-of-Experts.
        size: "11.2 GB (Q4_K_M)"
        parameters:
          repo_id: bartowski/meta-llama_Llama-4-Scout-17B-16E-Instruct-old-GGUF
          filename: meta-llama_Llama-4-Scout-17B-16E-Instruct-Q4_K_M.gguf
      - name: Qwen3-VL 32B Thinking (vision + reasoning)
        description: Vision + chain-of-thought reasoning.
        size: "19.5 GB (Q4_K_M)"
        parameters:
          repo_id: bartowski/Qwen_Qwen3-VL-32B-Thinking-GGUF
          filename: Qwen_Qwen3-VL-32B-Thinking-Q4_K_M.gguf
      - name: Qwen3 72B Embiggened (enhanced dense reasoning)
        description: Enhanced Qwen 3 72B cognitive model.
        size: "43.1 GB (Q4_K_M)"
        parameters:
          repo_id: bartowski/cognitivecomputations_Qwen3-72B-Embiggened-GGUF
          filename: Qwen3-72B-Embiggened-Q4_K_M.gguf
      - name: Devstral 2 123B (heavy coding)
        description: Large-scale coding model, needs lots of VRAM.
        size: "71.4 GB (Q4_K_M)"
        parameters:
          repo_id: bartowski/mistralai_Devstral-2-123B-Instruct-2512-GGUF
          filename: Devstral-2-123B-Instruct-2512-Q4_K_M.gguf
      - name: GPT-OSS 120B (open research)
        description: OpenAI open-weight research model.
        size: "69.8 GB (Q4_K_M)"
        parameters:
          repo_id: bartowski/openai_gpt-oss-120b-GGUF
          filename: gpt-oss-120b-Q4_K_M.gguf
      - name: DeepSeek V3 0324 (671B MoE)
        description: DeepSeek V3 Mixture-of-Experts, huge.
        size: "365 GB (Q4_K_M)"
        parameters:
          repo_id: bartowski/deepseek-ai_DeepSeek-V3-0324-GGUF
          filename: DeepSeek-V3-0324-Q4_K_M.gguf

  - name: bind_multimodal_model
    title: Bind Vision Projector
    description: "Explicitly associates a GGUF model with an mmproj file."
    parameters:
      - name: model_name
        type: str
        description: "GGUF model filename."
        mandatory: true
      - name: mmproj_name
        type: str
        description: "mmproj GGUF filename."
        mandatory: true
    output:
      - name: status
        type: bool
      - name: message
        type: str

  - name: unload_model
    title: Unload Model
    description: "Stops the running server for a given model."
    parameters:
      - name: model_name
        type: str
        description: "Model filename to unload (defaults to current model)."
        mandatory: false
    output:
      - name: status
        type: bool

  - name: update
    title: Update llama.cpp Binaries
    description: "Downloads and reinstalls the latest llama.cpp server binaries from GitHub. Returns status and message."
    parameters: []
    output:
      - name: status
        type: bool
        description: "True if update succeeded, False otherwise"
      - name: message
        type: str
        description: "Detailed status message or error description"