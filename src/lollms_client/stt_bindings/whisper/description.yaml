title: Whisper STT Binding
author: ParisNeo
creation_date: 2025-10-21
last_update_date: 2026-09-25
description: >
  A resilient Speech-To-Text (STT) binding for transcribing audio using OpenAI's
  Whisper models. Features cross-process server mutualization and event-driven
  continuous dynamic micro-batching. Multiple lollms_client instances and worker
  processes attach seamlessly to a single shared daemon on loopback with zero VRAM
  duplication and zero port drift.
global_input_parameters:
  - name: host
    type: str
    description: "The host address for the shared Whisper server."
    mandatory: false
    default: "127.0.0.1"
  - name: port
    type: int
    description: "The port on which the shared Whisper server daemon runs."
    mandatory: false
    default: 9633
  - name: auto_start_server
    type: bool
    description: "Automatically spawn the shared server daemon in the background if not already active."
    mandatory: false
    default: true
  - name: wait_for_server
    type: bool
    description: "Block until the shared server is fully initialized and operational."
    mandatory: false
    default: true
  - name: batch_window
    type: float
    description: "Dynamic micro-batch collection window in seconds (default: 0.02s)."
    mandatory: false
    default: 0.02
  - name: max_batch_size
    type: int
    description: "Maximum batch size for concurrent transcription requests (default: 8)."
    mandatory: false
    default: 8
  - name: service_key
    type: str
    description: "Authentication token for securing server access. Loaded from whisper_server.token if omitted."
    mandatory: false
    default: ""
  - name: venv_path
    type: str
    description: "Path to the dedicated virtual environment for the Whisper server."
    mandatory: false
    default: "./venv/stt_whisper_venv"
  - name: cache_dir
    type: str
    description: "Directory where Whisper models, logs, and authentication tokens are stored."
    mandatory: false
    default: "./data/stt_models/whisper"
model_input_parameters:
  - name: model_name
    type: str
    description: "The Whisper model size to use ('tiny', 'base', 'small', 'medium', 'large', 'large-v3', 'turbo')."
    mandatory: false
    default: "base"
commands:
  - name: status
    title: Daemon Status
    description: "Show whether the shared Whisper daemon is running and on which address."
    parameters: []
    output:
      - name: status
        type: bool
        description: "True if the daemon is running."
      - name: message
        type: str
        description: "Human-readable status description."
      - name: data
        type: dict
        description: "Structured payload with running flag and base_url."
  - name: ps
    title: Process Status
    description: "List loaded Whisper models, their devices, queue sizes, and last-used times."
    parameters: []
    output:
      - name: models
        type: list
        description: "List of per-model manager states (model_name, device, queue_size, last_used)."
  - name: kill
    title: Kill Daemon
    description: "Terminate the shared Whisper daemon. Attempts a graceful HTTP shutdown first, then escalates to OS-level process termination via the persisted PID file."
    parameters:
      - name: force
        type: bool
        description: "Skip the graceful HTTP shutdown and terminate the process immediately."
        mandatory: false
        default: false
    output:
      - name: status
        type: bool
        description: "True if the daemon was terminated or was not running."
      - name: message
        type: str
        description: "Human-readable result description."
  - name: restart
    title: Restart Daemon
    description: "Force-kill the shared Whisper daemon and relaunch a fresh instance with current code."
    parameters: []
    output:
      - name: status
        type: bool
        description: "True if the daemon was restarted and is operational."
      - name: message
        type: str
        description: "Human-readable result description."