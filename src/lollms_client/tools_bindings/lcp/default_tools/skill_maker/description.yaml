name: skill_maker
description: >-
  RSI toolset for skills (SKILL.md files). Enumerate, read, write, test,
  revert, discard and commit skill sources. Every per-skill tool
  auto-selects the sole visible skill when the caller does not supply a
  name, matching the toolset_editor ergonomics. Full content or Aider
  SEARCH/REPLACE patches are supported; edits are validated before write,
  backups and release manifests live under .rsi_backup/ and .rsi/commits/
  so the workflow is fully reversible and git-free. Act-phase tools
  (run_test_agent, commit_skill) require enable_skillmaker=True.
icon: "📚"
author: lollms-client
version: "0.2.0"
category: developer
tools:
  - name: tool_list_skills
    description: Enumerate every skill visible to the session (registered skills first, then standard skill roots). Call this first when the target slug is unknown.
  - name: tool_read_skill_source
    description: Return the full SKILL.md source. Auto-selects the sole visible skill when called without an argument.
  - name: tool_write_skill_source
    description: Write new SKILL.md content (full or Aider SEARCH/REPLACE). Validates before touching disk. Auto-selects the sole visible skill when unnamed.
  - name: tool_test_skill_source
    description: Validate the SKILL.md frontmatter and structure. Auto-selects the sole visible skill when unnamed.
  - name: tool_run_skill_test_agent
    description: Spawn a CONSTRAINED child agent equipped with the skill's declared tools and run it. Refused for code-execution skills. Requires enable_skillmaker=True.
  - name: tool_list_skill_versions
    description: List every revert target (releases, backups, git HEAD status). Auto-selects the sole visible skill when unnamed.
  - name: tool_revert_skill
    description: Revert the skill to a prior snapshot (0 = undo last write). Post-validation auto-rolls-back broken snapshots. Auto-selects the sole visible skill when unnamed.
  - name: tool_discard_skill_changes
    description: Hard-abort the current experiment (reset to last committed state). Auto-selects the sole visible skill when unnamed.
  - name: tool_commit_skill
    description: Record a release (git-free manifest), opportunistically git-commit, then remount the skill. Auto-selects the sole visible skill when unnamed. Requires enable_skillmaker=True.