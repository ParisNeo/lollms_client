name: word_tools
description: >
  Dedicated Word toolset: create, edit and read .docx/.docm documents via
  sandboxed python-docx recipe code. Full edit vocabulary as hints (not
  restrictions): comments (add_comment helper), highlights (WD_COLOR_INDEX),
  reformatting (styles/fonts/alignment/spacing), sections (WD_SECTION),
  links/fields via OXML (qn). Every save is verified with a strict
  three-layer OOXML integrity check before being committed to the workspace.
tools:
  - name: tool_build_word
    description: Creates a new Word document from a sandboxed python-docx recipe. Root object pre-bound as doc. Hints: styles, tables, images via media(), headers/footers, TOC field via OXML, sections via doc.add_section().
    parameters:
      - name: file
        type: str
        description: "Target .docx/.docm file name (default: document.docx)."
        mandatory: false
        default: "document.docx"
      - name: recipe
        type: str
        description: "Plain Python recipe mutating the pre-bound doc object. The LLM codes freely; hints are in the tool description."
        mandatory: false
        default: ""
  - name: tool_edit_word
    description: Edits an existing Word document in place via a sandboxed python-docx recipe. Edit vocabulary hints: add_comment(doc, paragraph, text) for comments, WD_COLOR_INDEX for highlights, styles/fonts/alignment for reformatting, doc.add_section(WD_SECTION.NEW_PAGE) for sections, OXML field codes (qn) for links/TOC. Transactional save: pre-edit bytes restored on validation failure.
    parameters:
      - name: file
        type: str
        description: "Path of the document to edit (relative to the discussion working dir or absolute)."
        mandatory: true
      - name: recipe
        type: str
        description: "Plain Python recipe mutating the opened doc object. Comments, highlights, reformat, sections, links — hints in the tool description."
        mandatory: false
        default: ""
  - name: tool_read_word
    description: Reads an existing Word document and returns a markdown inventory (paragraphs with styles, tables). Validates the file first; corrupt files return a structured failure.
    parameters:
      - name: file
        type: str
        description: "Path of the document to read (relative to the discussion working dir or absolute)."
        mandatory: true