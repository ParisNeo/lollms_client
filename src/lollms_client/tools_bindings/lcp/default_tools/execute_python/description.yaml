binding_name: execute_python
title: Execute Python
author: ParisNeo & Lollms
version: 2.3.0
description: >
  Sandboxed Python execution toolset with three tools, all defined in the single
  library file execute_python.py:
  - tool_create_and_execute_python_file: THE DEFAULT for substantial programs.
    Writes the given 'code' to a workspace .py file AND executes it in ONE call.
    This eliminates the wasteful two-call pattern (inline run, then run-file) and
    saves a full round-trip. Use it for anything multi-step, reusable, or iterative.
  - tool_execute_python_file: executes an EXISTING workspace .py file with optional
    argv-style arguments (sys.argv / argparse compatible). Read-only: never saves,
    creates, or overwrites files. Use it to RE-RUN a file that already exists.
  - tool_execute_python_code: executes INLINE Python source (the 'code' string).
    Nothing is saved to disk by the tool itself. STRICTLY RESERVED for short,
    punctual, throwaway snippets (quick checks, one-liner computations, tiny
    experiments of a few lines). It must NOT be used for substantial programs.
  SELECTION DOCTRINE (mandatory): PREFER tool_create_and_execute_python_file for
  anything substantial — it writes and runs in a single call. Use
  tool_execute_python_file only to re-run an already-created file. Use
  tool_execute_python_code only for short, punctual, disposable one-liners.
input_parameters:
  - name: code
    type: str
    description: "The raw Python source code. For tool_create_and_execute_python_file: the COMPLETE program to write to disk and run (preferred for substantial code). For tool_execute_python_code: a SHORT, punctual, throwaway snippet only (nothing is written to disk)."
    mandatory: false
  - name: file_name
    type: str
    description: "Target .py file name. For tool_create_and_execute_python_file: the file to CREATE/OVERWRITE in the workspace before execution (bare name, no directories; path traversal is blocked). For tool_execute_python_file: the name of an EXISTING .py file to run (read-only)."
    mandatory: false
  - name: args
    type: list
    description: Command-line style arguments exposed to the script via sys.argv[1:] (tool_create_and_execute_python_file and tool_execute_python_file). All values are stringified.
    mandatory: false
commands:
  - name: tool_create_and_execute_python_file
    title: Create and Execute Python File
    description: >
      PREFERRED for substantial programs. Writes the given 'code' to a workspace
      .py file and executes it in ONE call, capturing stdout, stderr, and
      matplotlib figures. The file is written only after user authorization, so a
      rejected prompt leaves no dangling file. Overwrites an existing file of the
      same name (intended for iterative fixes). Use this instead of the two-call
      pattern (inline run, then run-file).
  - name: tool_execute_python_file
    title: Execute Python File
    description: >
      Executes an EXISTING workspace .py file with optional argv-style arguments
      in a sandboxed environment, capturing stdout, stderr, and matplotlib figures.
      Read-only; never saves files. Use it to RE-RUN a file that already exists.
  - name: tool_execute_python_code
    title: Execute Python Code
    description: >
      Executes a SHORT, PUNCTUAL inline Python snippet in a sandboxed environment.
      STRICTLY reserved for brief throwaway code (quick checks, one-liners, tiny
      experiments). Nothing is saved to disk. For substantial, reusable, or
      iterative code, use tool_create_and_execute_python_file instead.