name: computer_use
description: >
  Desktop automation toolset (Computer Use). Take screenshots, inspect screen geometry,
  move cursor, click coordinates or visually-grounded elements, drag and drop,
  type text, press keys, scroll, and wait for UI transitions. Requires the active
  model to have vision capability.
icon: "🖥️"
tools:
  - tool_computer_desktop_info
  - tool_computer_screenshot
  - tool_computer_click
  - tool_computer_move_cursor
  - tool_computer_mouse_down
  - tool_computer_mouse_up
  - tool_computer_drag
  - tool_computer_type
  - tool_computer_key
  - tool_computer_scroll
  - tool_computer_wait
  - tool_computer_cursor_position