name: LCP
binding_name: LCPBinding
author: ParisNeo
description: The Local LollmsCommunicationProtocol (LCP) binding
version: "1.0"
icon: 🛠️
commands:
  cleanup:
    function_name: cleanup
    description: Cleans up dynamically generated tools.
    parameters:
      - name: status
        type: str
        description: Status description to return
        default: ""
global_input_parameters:
  - name: enable_auto_model_selection
    type: bool
    description: "If true, load the models_tools toolset (list models with routing settings, switch models, spawn child agents on other models)."
    value: true
    mandatory: false
  - name: tools_folders
    type: str
    description: "Path(s) to tool libraries. Accepts a single path or a list of paths."
    value: ""
    mandatory: false
  - name: tools_folder_path
    type: str
    description: "Legacy alias for tools_folders. Accepts a full path to a folder of tool libraries."
    value: ""
    mandatory: false
  - name: tool_files
    type: str
    description: "Path(s) to individual .py tool files. Providing tool_files implies an empty folder scan."
    value: ""
    mandatory: false
  - name: host_tool_configs
    type: str
    description: "Host-provided configurations for tool libraries, keyed by library stem."
    value: ""
    mandatory: false
  - name: confirm_handler
    type: str
    description: "Host callback for authorizing sensitive actions."
    value: ""
    mandatory: false
  - name: user_interaction_handler
    type: str
    description: "Host callback for collecting user input (text, secret, select)."
    value: ""
    mandatory: false
model_input_parameters: []