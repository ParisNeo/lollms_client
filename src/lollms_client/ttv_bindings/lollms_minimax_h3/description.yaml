title: "vLLM-Omni / MiniMax-H3 TTV (Self-Managed)"
author: "ParisNeo"
version: 2.0.0
binding_name: "vllm_omni_ttv"
description: |
  Dual-mode binding for vLLM-Omni and MiniMax-H3 video generation models.
  
  Mode 1 (remote): Connects to an external running vLLM-Omni server.
  Mode 2 (managed): LoLLMs manages, starts, stops, and configures the local 
  vLLM-Omni server process, virtual environment, and local HF models cache.

global_input_parameters:
  - name: "server_mode"
    type: "str"
    default: "remote"
    options: ["remote", "managed"]
    description: "'remote' to connect to an external server, 'managed' to let LoLLMs manage a local vLLM-Omni process."

  - name: "base_url"
    type: "str"
    default: "http://localhost:8002"
    description: "URL of the vLLM-Omni server endpoint."

  - name: "api_key"
    type: "str"
    default: ""
    description: "Optional Bearer token if authorization is required."
    is_secret: true

  - name: "venv_path"
    type: "str"
    default: "./venv_vllm_omni"
    description: "[Managed Mode] Path to Python virtual environment containing vllm and vllm-omni."

  - name: "models_dir"
    type: "str"
    default: "./data/models/vllm_omni"
    description: "[Managed Mode] Path to local directory storing downloaded Hugging Face model checkpoints."

  - name: "gpus"
    type: "str"
    default: "0"
    description: "[Managed Mode] CUDA_VISIBLE_DEVICES string (e.g. '0', '0,1', '2')."

  - name: "gpu_memory_utilization"
    type: "float"
    default: 0.90
    description: "[Managed Mode] VRAM allocation limit fraction (0.50 - 0.95)."

  - name: "port"
    type: "int"
    default: 8002
    description: "[Managed Mode] Port number on which to launch the local server."

  - name: "auto_start_server"
    type: "bool"
    default: true
    description: "[Managed Mode] Automatically launch the server if not running when a generation request is made."

  - name: "timeout"
    type: "int"
    default: 600
    description: "HTTP request timeout in seconds."

model_input_parameters:
  - name: "model"
    type: "str"
    default: "ParisNeo/MiniMax-H3-FL2VA-FP8"
    description: "Model ID or path forwarded to the server."

  - name: "default_aspect_ratio"
    type: "str"
    default: "16:9"
    description: "Default aspect ratio ('16:9', '9:16', '1:1', '4:3', '21:9')."

  - name: "default_duration"
    type: "float"
    default: 4.0
    description: "Video duration in seconds (4.0 to 15.0)."

  - name: "default_fps"
    type: "int"
    default: 24
    description: "Fixed frame rate required by MiniMax-H3 (strictly 24)."

  - name: "num_inference_steps"
    type: "int"
    default: 30
    description: "Denoising steps."

commands:
  - name: "health_check"
    description: "Check if the target server is online."
    params: []

  - name: "start_server"
    description: "[Managed Mode] Launch the local vLLM-Omni server process."
    params: []

  - name: "stop_server"
    description: "[Managed Mode] Stop the running local server to free VRAM."
    params: []

  - name: "install_environment"
    description: "[Managed Mode] Create virtualenv and install vllm & vllm-omni."
    params: []

  - name: "pull_model"
    description: "[Managed Mode] Download model weights from Hugging Face."
    params:
      - name: "model_name"
        type: "str"
        description: "Hugging Face repository ID (e.g., ParisNeo/MiniMax-H3-FL2VA-FP8)."

  - name: "generate_video"
    description: "Text-to-Video generation."
    params:
      - name: "prompt"
        type: "str"
        description: "Prompt text."

  - name: "generate_video_from_image"
    description: "Single Image-to-Video generation."
    params:
      - name: "prompt"
        type: "str"
        description: "Prompt text."
      - name: "image"
        type: "str"
        description: "File path or base64 data string."

  - name: "generate_video_first_and_last_frame"
    description: "First & Last frame transition interpolation."
    params:
      - name: "prompt"
        type: "str"
        description: "Prompt text."
      - name: "start_image"
        type: "str"
        description: "Path or base64 string for start frame."
      - name: "end_image"
        type: "str"
        description: "Path or base64 string for end frame."