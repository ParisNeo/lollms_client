title: "MiniMax-H3 Omni TTV & I2V"
author: "ParisNeo"
version: 1.1.0
binding_name: "minimax_h3"
description: |
  A specialized LoLLMs TTV binding for MiniMax-H3 video generation models 
  served via vLLM-Omni. 

  Supports Text-to-Video (T2VA), Single Image-to-Video (I2V), and First/Last Frame
  Interpolation (FL2VA) using native vLLM-Omni input_reference and input_references fields.

  Start your server with:
    vllm serve ParisNeo/MiniMax-H3-FL2VA-FP8 \
      --omni --task-type fl2va --trust-remote-code \
      --enable-layerwise-offload --cache-backend cache_dit \
      --port 8002

global_input_parameters:
  - name: "base_url"
    type: "str"
    default: "http://localhost:8002"
    description: "Full base URL of the running vLLM-Omni server (e.g., http://localhost:8002)."

  - name: "api_key"
    type: "str"
    default: ""
    description: "Optional Bearer token if authentication is enabled on the server."
    is_secret: true

  - name: "timeout"
    type: "int"
    default: 600
    description: "HTTP request timeout in seconds. Video generation can take several minutes."

model_input_parameters:
  - name: "model"
    type: "str"
    default: "ParisNeo/MiniMax-H3-FL2VA-FP8"
    description: "Model identifier forwarded to the server."

  - name: "default_aspect_ratio"
    type: "str"
    default: "16:9"
    description: "Default aspect ratio format for T2V ('16:9', '9:16', '1:1', '4:3', '21:9')."

  - name: "default_duration"
    type: "float"
    default: 4.0
    description: "Video duration in seconds. Must be between 4.0 and 15.0."

  - name: "default_fps"
    type: "int"
    default: 24
    description: "Frames-per-second. MiniMax-H3 output frame rate is strictly fixed at 24."

  - name: "num_inference_steps"
    type: "int"
    default: 30
    description: "Number of denoising steps (recommended: 30)."

  - name: "output_format"
    type: "str"
    default: "mp4"
    description: "Output container format ('mp4')."

commands:
  - name: "health_check"
    description: "Ping the server /health endpoint to check readiness."
    params: []

  - name: "server_info"
    description: "Fetch server metadata from /info or /v1/models."
    params: []

  - name: "list_models"
    description: "Query running server for loaded models via /v1/models."
    params: []

  - name: "generate_video"
    description: "Text-to-video generation using MiniMax-H3."
    params:
      - name: "prompt"
        type: "str"
        description: "Detailed text prompt describing the video."
      - name: "negative_prompt"
        type: "str"
        default: ""
        description: "Negative prompt to guide generation away from unwanted elements."
      - name: "aspect_ratio"
        type: "str"
        default: "16:9"
        description: "Aspect ratio override ('16:9', '9:16', '1:1', etc.)."
      - name: "duration"
        type: "float"
        default: 4.0
        description: "Duration in seconds (4.0 - 15.0)."
      - name: "seed"
        type: "int"
        default: -1
        description: "Random seed (-1 for random)."

  - name: "generate_video_from_image"
    description: "Single image-to-video generation (FL2VA mode using input_reference)."
    params:
      - name: "prompt"
        type: "str"
        description: "Motion/scene description prompt."
      - name: "image"
        type: "str"
        description: "Path or base64 data string of the start image."
      - name: "duration"
        type: "float"
        default: 4.0
        description: "Duration in seconds (4.0 - 15.0)."
      - name: "seed"
        type: "int"
        default: -1
        description: "Random seed (-1 for random)."

  - name: "generate_video_first_and_last_frame"
    description: "First and last frame interpolation (FL2VA mode using input_references)."
    params:
      - name: "prompt"
        type: "str"
        description: "Motion/transition prompt."
      - name: "start_image"
        type: "str"
        description: "Path or base64 string for the start frame."
      - name: "end_image"
        type: "str"
        description: "Path or base64 string for the end frame."
      - name: "duration"
        type: "float"
        default: 4.0
        description: "Duration in seconds (4.0 - 15.0)."
      - name: "seed"
        type: "int"
        default: -1
        description: "Random seed (-1 for random)."